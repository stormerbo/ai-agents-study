[project]
name = "p4-durable-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.146.0",
  "pydantic==2.14.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "rfc8785==0.1.4",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
provider = [
    "anthropic==1.15.0",
    "mcp==2.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = ["integration: real Compose PostgreSQL and independent API processes (required, never skipped)"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
